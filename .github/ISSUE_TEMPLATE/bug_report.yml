name: گزارش باگ
description: یک رفتار قابل بازتولید را گزارش کنید
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: لطفاً کلید API، مسیرهای شخصی و محتوای محرمانه را حذف کنید.
  - type: textarea
    id: description
    attributes:
      label: شرح
      description: چه اتفاقی افتاد و انتظار داشتید چه شود؟
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: مراحل بازتولید
      placeholder: |
        1. برنامه را باز کنید
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: نسخه
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: نسخهٔ ویندوز
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: گزارش‌های پاک‌سازی‌شده
      render: shell
